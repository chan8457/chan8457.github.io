<script>
document.addEventListener("DOMContentLoaded", function () {
  /* ===============================
     1. 본문 표 자동 가로 스크롤 wrapper
     =============================== */
  const tables = document.querySelectorAll(
    ".layout--single:not(.home-page) .page__content table"
  );

  tables.forEach(function (table) {
    if (table.closest(".mobile-table-scroll")) return;

    const wrapper = document.createElement("div");
    wrapper.className = "mobile-table-scroll";

    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });


  /* ===============================
     2. 모바일 햄버거 메뉴 강제 구성
     =============================== */
  function buildMobileHamburgerMenu() {
    const nav = document.querySelector(".greedy-nav");
    if (!nav) return;

    const hiddenLinks = nav.querySelector(".hidden-links");
    if (!hiddenLinks) return;

    /*
      모바일 햄버거 안에 들어갈 메뉴를 직접 지정.
      기존에 있던 중복/빈 li를 전부 지우고 다시 만듦.
    */
    hiddenLinks.innerHTML = "";

    const mobileMenus = [
      {
        text: "Insights",
        href: "/insights/"
      },
      {
        text: "Contact",
        href: "/contact/"
      }
    ];

    mobileMenus.forEach(function (menu) {
      const li = document.createElement("li");
      const a = document.createElement("a");

      a.href = menu.href;
      a.textContent = menu.text;

      li.appendChild(a);
      hiddenLinks.appendChild(li);
    });
  }

  buildMobileHamburgerMenu();

  /*
    Minimal Mistakes greedy nav가 로드 후 메뉴를 다시 만질 수 있어서
    약간의 딜레이를 두고 다시 한 번 구성
  */
  setTimeout(buildMobileHamburgerMenu, 300);
  setTimeout(buildMobileHamburgerMenu, 800);

  window.addEventListener("resize", function () {
    buildMobileHamburgerMenu();
  });
});
</script>
