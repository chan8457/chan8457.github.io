<script>
document.addEventListener("DOMContentLoaded", function () {
  /* ===============================
     1. 본문 표 자동 가로 스크롤 wrapper
     =============================== */
  const tables = document.querySelectorAll(
    ".layout--single:not(.home-page) .page__content table"
  );

  tables.forEach(function (table) {
    if (table.closest(".mobile-table-scroll")) return;

    const wrapper = document.createElement("div");
    wrapper.className = "mobile-table-scroll";

    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });


  /* ===============================
     2. 햄버거 메뉴 중복 제거
     =============================== */
  function removeDuplicateHamburgerLinks() {
    const hiddenLinks = document.querySelector(".greedy-nav .hidden-links");
    if (!hiddenLinks) return;

    const seen = new Set();

    Array.from(hiddenLinks.querySelectorAll("li")).forEach(function (item) {
      const link = item.querySelector("a");

      if (!link) {
        item.remove();
        return;
      }

      const text = link.textContent.trim().replace(/\s+/g, " ");
      const href = link.getAttribute("href") || "";
      const key = text + "|" + href;

      if (seen.has(key)) {
        item.remove();
      } else {
        seen.add(key);
      }
    });
  }

  removeDuplicateHamburgerLinks();

  setTimeout(removeDuplicateHamburgerLinks, 200);
  setTimeout(removeDuplicateHamburgerLinks, 600);
  setTimeout(removeDuplicateHamburgerLinks, 1200);

  const nav = document.querySelector(".greedy-nav");
  if (nav) {
    const observer = new MutationObserver(function () {
      removeDuplicateHamburgerLinks();
    });

    observer.observe(nav, {
      childList: true,
      subtree: true
    });
  }
});
</script>
